name: Android APK and server checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify engine, server and Android app
        env:
          RUMMI_SERVER_URL: ${{ vars.RUMMI_SERVER_URL }}
        run: ./gradlew --no-daemon :core:test :server:test :app:lintDebug :app:assembleDebug :server:distZip
      - name: Prepare installable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/RummiClub-debug.apk
          sha256sum artifacts/RummiClub-debug.apk > artifacts/SHA256SUMS
      - name: Build signed release when signing secrets exist
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUMMI_SERVER_URL: ${{ vars.RUMMI_SERVER_URL }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Signing secrets absent; installable debug APK is available.'
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/rummiclub-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk artifacts/RummiClub-release.apk
          sha256sum artifacts/RummiClub-release.apk >> artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RummiClub-Android-APK
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RummiClub-server
          path: server/build/distributions/*.zip
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            server/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
