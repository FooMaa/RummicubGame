openapi: 3.0.0
info:
  title: Rummi Club API
  version: 1.0.0
paths:
  /health:
    get:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        tag: game
        service_account_id: ${GATEWAY_SERVICE_ACCOUNT_ID}
  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        tag: game
        service_account_id: ${GATEWAY_SERVICE_ACCOUNT_ID}
